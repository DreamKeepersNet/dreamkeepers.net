<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamKeepers</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100%;
      background-color: #000;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Logo Animation */
    .logo-container {
      position: relative;
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 4rem;
      text-shadow: 0 0 20px #00bfff, 0 0 40px #00bfff;
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00bfff; }
      to { text-shadow: 0 0 30px #00bfff, 0 0 60px #00bfff; }
    }

    /* Sparkle Overlay */
    .sparkle-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at random(100%) random(100%), rgba(0,191,255,0.5) 1px, transparent 1px);
      animation: flicker 3s infinite alternate;
      opacity: 0.3;
      z-index: 1;
    }

    @keyframes flicker {
      from { opacity: 0.2; }
      to { opacity: 0.4; }
    }

    /* Navigation */
    nav {
      margin-top: 40px;
      display: flex;
      gap: 40px;
      z-index: 2;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      position: relative;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0%;
      height: 2px;
      background-color: #00bfff;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #00bfff;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      nav {
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
      }

      nav a {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle-overlay"></div>
  
  <div class="logo-container">
    <h1>DreamKeepers</h1>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </nav>
</body>
</html>
