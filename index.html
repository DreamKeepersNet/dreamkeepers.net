<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamKeepers | DK Media Group</title>

  <!-- Elegant Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* GLOBAL LAYOUT & BACKGROUND */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      overflow-x: hidden;
    }

    /* NAVIGATION BAR */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 0 15px rgba(0, 224, 255, 0.3);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      margin: 0 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    nav a:hover,
    nav a.active {
      color: #00e0ff;
      border-bottom: 3px solid #00e0ff;
      text-shadow: 0 0 10px #00e0ff;
    }

    /* SECTIONS */
    section {
      min-height: 100vh;
      padding: 80px 10%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* HOME PAGE */
    #home {
      background: radial-gradient(circle at center, #001a1a, #000);
    }

    #home img {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px #00e0ff);
    }

    #home h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #00e0ff;
      text-shadow: 0 0 15px #00e0ff;
    }

    #home p {
      font-size: 1.2rem;
      color: #ccc;
      max-width: 600px;
    }

    /* ABOUT PAGE */
    #about {
      background: linear-gradient(135deg, #1a1a1a, #000033);
    }

    #about h1 {
      color: #a000ff;
      text-shadow: 0 0 10px #a000ff;
    }

    /* SERVICES PAGE */
    #services {
      background: linear-gradient(135deg, #001a00, #000);
    }

    #services h1 {
      color: #00ff8c;
      text-shadow: 0 0 10px #00ff8c;
    }

    /* CONTACT PAGE */
    #contact {
      background: linear-gradient(135deg, #1a0000, #000);
    }

    #contact h1 {
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
    }

    /* ADMIN LOGIN */
    #admin {
      background: linear-gradient(135deg, #101010, #000);
    }

    #admin h1 {
      color: #00e0ff;
      text-shadow: 0 0 10px #00e0ff;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      width: 100%;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #111;
      color: white;
    }

    button {
      padding: 10px 25px;
      background: #00e0ff;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00bcd4;
    }

    /* EMPLOYEE VERIFICATION */
    #verify {
      background: linear-gradient(135deg, #0d0d0d, #002244);
    }

    #verify h1 {
      color: #00e0ff;
      text-shadow: 0 0 10px #00e0ff;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #999;
      background-color: #000;
      border-top: 1px solid #111;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#home" class="active">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
    <a href="#admin">Admin Login</a>
    <a href="#verify">Employee Verification</a>
  </nav>

  <section id="home">
    <img src="images/dk_logo.png" alt="DreamKeepers Logo" />
    <h1>DreamKeepers</h1>
    <p>Don't ever stop dreaming. Make your dreams a reality.</p>
  </section>

  <section id="about">
    <h1>About Us</h1>
    <p>DK Media Group and DK Tech stand at the intersection of creativity and innovation
