<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DK Media Group | DK Tech</title>

  <style>
    /* =================================================== */
    /* 1. GLOBAL RESET & BACKGROUND SETUP */
    /* =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }

    /* =================================================== */
    /* 2. LANDING PAGE CONTAINER */
    /* =================================================== */
    #landing-page {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    /* =================================================== */
    /* 3. LOGO & SPARKLE EFFECT */
    /* =================================================== */
    .logo-container {
      position: relative;
      width: 400px;
      max-width: 90%;
    }

    .logo-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0, 224, 255, 0.4);
    }

    .sparkle-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 10px;
      box-shadow:
        0 0 20px 10px rgba(0, 224, 255, 0.3),
        50px 30px 15px 5px rgba(255, 255, 255, 0.2),
        -70px -40px 18px 6px rgba(255, 255, 255, 0.15);
      animation: sparkle-move 15s linear infinite alternate;
      opacity: 0.7;
      filter: blur(6px);
    }

    @keyframes sparkle-move {
      0% { transform: scale(0.9) translate(0, 0); }
      25% { transform: scale(1.1) translate(15px, 10px); }
      50% { transform: scale(1.0) translate(-10px, -15px); }
      75% { transform: scale(1.1) translate(-20px, 10px); }
      100% { transform: scale(0.9) translate(0, 0); }
    }

    /* =================================================== */
    /* 4. NAVIGATION LINKS */
    /* =================================================== */
    nav {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }

    .nav-link {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1.2em;
      letter-spacing: 2px;
      font-weight: bold;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-link:hover {
      color: #00e0ff;
      text-shadow: 0 0 10px #00e0ff, 0 0 20px #00e0ff;
    }

    /* =================================================== */
    /* 5. FOOTER TAGLINE */
    /* =================================================== */
    footer {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9em;
      color: #888;
      letter-spacing: 1px;
    }

    /* =================================================== */
    /* 6. RESPONSIVE DESIGN */
    /* =================================================== */
    @media (max-width: 768px) {
      .nav-link {
        display: inline-block;
        margin: 10px;
        font-size: 1em;
      }

      footer {
        font-size: 0.8em;
      }
    }
  </style>
</head>

<body>

  <!-- LANDING PAGE -->
  <!-- =================================================== -->
  <section id="landing-page">
    <div class="logo-container">
      <img src="images/dk_logo_b
