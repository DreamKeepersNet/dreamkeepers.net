<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Keepers</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Reset and layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: "Poppins", sans-serif;
      color: #ffffff;
      background-color: #0e0e0e;
      overflow: hidden;
    }

    /* Splash screen container */
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: url('images/logo.png') no-repeat center center/contain;
      background-color: #000000;
      background-size: 40%;
    }

    .splash-content {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      font-weight: 300;
      color: #cccccc;
    }

    .enter-btn {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .enter-btn:hover {
      background-color: #1a1a1a;
      color: #ffffff;
      border: 2px solid #ffffff;
    }
  </style>
</head>

<body>
  <section class="splash">
    <div class="splash-content">
      <h1>Dream Keepers</h1>
      <p>While people are asleep dreaming, Dream Keepers are awake creating their dreams.</p>
      <button class="enter-btn" onclick="location.href='home.html'">Enter Site</button>
    </div>
  </section>
</body>
</html>
